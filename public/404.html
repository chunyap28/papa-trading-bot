<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Build Your First Trading Bot</title>
    <!--
      GitHub Pages serves this file for any path it doesn't recognize (i.e. every SPA
      route other than "/"). We stash the requested path and bounce to "/", where the
      inline script in index.html restores it via history.replaceState so React Router
      can take over. This makes deep links (e.g. /BuildYourFirstTradingBot) and page
      refreshes work correctly on GitHub Pages' static hosting.
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      sessionStorage.redirect = location.href;
      location.replace("/");
    </script>
  </head>
  <body></body>
</html>
